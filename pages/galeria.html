<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html"
            ><img src="../img/logo-header.webp" alt="Logo del café"
          /></a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="galeria.html"
                  >Galería</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="menu.html">Menú</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="cursos.html">Cursos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="conocenos.html">Conocenos</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <h1>Galería de Imágenes</h1>

      <div class="movil">
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="../img/interior1.webp" class="d-block w-100" alt="Interior de un café con gente sentada en mesas tomando café" />
            </div>
            <div class="carousel-item">
              <img src="../img/interior2.webp" class="d-block w-100" alt="Personas sentadas en mesas tomando café en un lugar sin techo" />
            </div>
            <div class="carousel-item">
              <img src="../img/interior3.webp" class="d-block w-100" alt="Entrada de nuestro café con barra de café y mesas" />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>

      <div class="escritorio">
        <section class="galeria">
          <h2>Nuestro Café</h2>
          <article class="tarjeta-cuadr1">
            <figure class="galeria-cuadr1" tabindex="0">
              <img
                src="../img/interior1.webp"
                alt="Interior de un café con gente sentada en mesas tomando café"
              />
              <figcaption>
                Interior de nuestro café - Un espacio para relajarse y tomar un
                buen café
              </figcaption>
            </figure>
          </article>
          <article class="tarjeta-vert">
            <figure class="galeria-vert" tabindex="0">
              <img
                src="../img/interior2.webp"
                alt="personas sentadas en mesas tomando cafe en un lugar sin techo"
              />
              <figcaption>
                Area de aire libre - Conoce nuestro espacio pet friendly
              </figcaption>
            </figure>
          </article>
          <article class="tarjeta-cuadr2">
            <figure class="galeria-cuadr2" tabindex="0">
              <img
                src="../img/interior3.webp"
                alt="entrada de nuestro café con barra de café y mesas"
              />
              <figcaption>
                Entrada a nuestro café - desde el primer paso un mundo de
                sabores te espera
              </figcaption>
            </figure>
          </article>
          <article class="tarjeta-hor">
            <figure class="galeria-hor" tabindex="0">
              <img
                src="../img/interior4.webp"
                alt="interior de nuestro café detras de la barra de café con mesas y sillas atras de puertas de vidrio"
              />
              <figcaption>El Café</figcaption>
            </figure>
          </article>
        </section>
      </div>
    </main>
    <footer>
      <p>&copy; Todos los derechos reservados.</p>
      <ul>
        <li>
          <a href="https://www.facebook.com" target="_blank"
            ><img src="../img/facebook.png" alt="Facebook"
          /></a>
        </li>
        <li>
          <a href="https://www.instagram.com" target="_blank"
            ><img src="../img/instagram.png" alt="Instagram"
          /></a>
        </li>
        <li>
          <a href="https://www.x.com" target="_blank"
            ><img src="../img/x.png" alt="X"
          /></a>
        </li>
      </ul>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
